---
- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
    - master.osgiliath.test
    - node1.osgiliath.test
  tasks:
    - name: "install fedora ansible prerequisites"
      ansible.builtin.raw: dnf install -y python3 python3-libdnf5
      changed_when: false
      become: true
- name: Prepare IDM
  hosts:
    - idm.osgiliath.test
  roles:
    - role: tcharl.freeipa_server
  vars:
    secure_logs: False
    skip_hostname_assert: True
    skip_nameserver_assert: True
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare secure the hosts
  hosts:
    - master.osgiliath.test
    - node1.osgiliath.test
  roles:
    - role: tcharl.ansible_securehost
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: Prepare namesservers
  hosts:
    - all
  roles:
    - role: tcharl.ansible_nameserver
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True # Nic name is randomized at startup
    skip_nameserver_assert: True
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
- name: configure containerization prereq # Execute master and nodes at the same time: one fact is created by the master and reused by nodes
  hosts: kube_master,kube_node
  roles:
    - role: geerlingguy.containerd
    - role: geerlingguy.swap
  vars:
    swap_file_state: absent
  become: Yes

- name: Prepare Kubernetes master
  hosts: kube_master,kube_node
  roles:
    - role: tcharl.ansible_orchestration
  vars:
    standalone_role: False
    secure_logs: False
    skip_hostname_assert: True
    skip_nameserver_assert: True
    preferred_nic: "enp0s5"
    idm_preferred_nic: "enp0s5"
    master_preferred_nic: "enp0s5"
    company_domain: osgiliath.test
    company_realm_password: '123ADMin'
    company_ad_password: '123ADmPass'
    kube_firewall_zone: 'internal'
